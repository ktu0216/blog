<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="600" fill="#0d1117"/>

  <text x="60" y="62" fill="#e6edf3" font-size="38" font-weight="800">28.2초 → 3.4초, 실제로 줄인 구간은 어디인가</text>
  <text x="60" y="98" fill="#8b949e" font-size="21">3.4초를 그대로 성과로 읽으면 안 된다 — 그 안에 원래 있던 기본값이 들어 있다</text>

  <!-- bar 1 -->
  <text x="100" y="152" fill="#8b949e" font-size="20" font-weight="700" letter-spacing="2">전 · 로그인 28.2초</text>

  <rect x="100" y="168" width="886" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="543" y="200" fill="#e6edf3" font-size="24" font-weight="800" text-anchor="middle">25.0초 · D-Bus 기본 타임아웃</text>
  <text x="543" y="224" fill="#8b949e" font-size="19" text-anchor="middle">logind → PID 1 응답 대기 — 이번에 사라진 구간</text>

  <rect x="990" y="168" width="110" height="64" rx="8" fill="#4aa3df"/>
  <text x="1045" y="208" fill="#0a1020" font-size="24" font-weight="800" text-anchor="middle">3.4초</text>

  <!-- zoom connector -->
  <path d="M990 236 L 100 300" stroke="#4aa3df" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M1100 236 L 1100 300" stroke="#4aa3df" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <text x="600" y="302" fill="#8b949e" font-size="19" text-anchor="middle">남은 3.4초를 펼쳐보면</text>

  <!-- bar 2 -->
  <text x="100" y="340" fill="#8b949e" font-size="20" font-weight="700" letter-spacing="2">후 · 로그인 3.4초 (확대)</text>

  <rect x="100" y="356" width="588" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="394" y="388" fill="#8b949e" font-size="24" font-weight="800" text-anchor="middle">2.0초 · 배포판 기본값</text>
  <text x="394" y="412" fill="#6e7681" font-size="19" text-anchor="middle" font-family="monospace">pam_faildelay.so delay=2000000</text>

  <rect x="692" y="356" width="408" height="64" rx="8" fill="#4aa3df"/>
  <text x="896" y="388" fill="#0a1020" font-size="24" font-weight="800" text-anchor="middle">1.4초 · 실질 오버헤드</text>
  <text x="896" y="412" fill="#0a1020" font-size="19" text-anchor="middle" opacity="0.75">정직하게 보면 이 값</text>

  <text x="100" y="462" fill="#8b949e" font-size="20"><tspan font-family="monospace" fill="#e6edf3">delay</tspan> 단위는 마이크로초 — 200만 마이크로초 = 2초</text>

  <line x1="60" y1="500" x2="1140" y2="500" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="60" y="546" fill="#e6edf3" font-size="22">대기 중 systemd job <tspan font-family="monospace" fill="#4aa3df">11개 → 0개</tspan> · 세션 생성 <tspan font-family="monospace" fill="#4aa3df">25초 타임아웃 후 실패 → 1초 내 성공</tspan></text>
</svg>
