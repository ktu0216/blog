<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#006cac"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8bd0f0"/>
    </marker>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="112" fill="#8bd0f0" font-size="27" text-anchor="middle" font-family="monospace" letter-spacing="2">리눅스 로그인 지연 · 두 번의 오진</text>

  <text x="540" y="200" fill="#ffffff" font-size="70" font-weight="800" text-anchor="middle">증상은 둘, 원인은 셋</text>
  <text x="540" y="258" fill="#cfe3f2" font-size="34" text-anchor="middle">하나로 묶으려다 두 번 틀렸다</text>
  <line x1="440" y1="296" x2="640" y2="296" stroke="#8bd0f0" stroke-width="3" opacity="0.7"/>

  <text x="245" y="332" fill="#8bd0f0" font-size="24" text-anchor="middle" font-weight="700" letter-spacing="4">증상</text>
  <text x="835" y="332" fill="#8bd0f0" font-size="24" text-anchor="middle" font-weight="700" letter-spacing="4">원인</text>

  <!-- symptoms -->
  <rect x="60" y="350" width="370" height="150" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.96"/>
  <text x="245" y="404" fill="#ffffff" font-size="31" font-weight="800" text-anchor="middle">비밀번호 변경 실패</text>
  <text x="245" y="452" fill="#8bd0f0" font-size="21" font-family="monospace" text-anchor="middle">PAM_AUTHTOK_ERR</text>
  <text x="245" y="482" fill="#8b949e" font-size="20" text-anchor="middle">만료 계정 강제 변경에서 중단</text>

  <rect x="60" y="560" width="370" height="150" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.96"/>
  <text x="245" y="614" fill="#ffffff" font-size="31" font-weight="800" text-anchor="middle">로그인 28.2초 지연</text>
  <text x="245" y="662" fill="#8bd0f0" font-size="21" font-family="monospace" text-anchor="middle">SSH · 이 서버만</text>
  <text x="245" y="692" fill="#8b949e" font-size="20" text-anchor="middle">20개월 동안 아무도 못 봄</text>

  <!-- causes -->
  <rect x="650" y="330" width="370" height="130" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.96"/>
  <text x="835" y="382" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">setuid 비트 제거</text>
  <text x="835" y="426" fill="#8b949e" font-size="21" font-family="monospace" text-anchor="middle">passwd · unix_chkpwd</text>

  <rect x="650" y="500" width="370" height="130" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.96"/>
  <text x="835" y="552" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">죽은 fstab 한 줄</text>
  <text x="835" y="596" fill="#8b949e" font-size="21" font-family="monospace" text-anchor="middle">삭제된 LV · home.mount</text>

  <rect x="650" y="690" width="370" height="140" rx="16" fill="#12151b" stroke="#30363d" stroke-width="2" stroke-dasharray="8 8" opacity="0.92"/>
  <text x="835" y="742" fill="#8b949e" font-size="30" font-weight="800" text-anchor="middle">PAM 설정 잔재</text>
  <text x="835" y="784" fill="#6e7681" font-size="21" font-family="monospace" text-anchor="middle">로그만 폭주 · 동작 무관</text>
  <text x="835" y="814" fill="#6e7681" font-size="20" text-anchor="middle">어느 증상과도 이어지지 않는다</text>

  <!-- connectors -->
  <path d="M430 425 C 540 425, 540 395, 644 395" stroke="#8bd0f0" stroke-width="3" fill="none" marker-end="url(#ah)" opacity="0.9"/>
  <path d="M430 635 C 540 635, 540 565, 644 565" stroke="#8bd0f0" stroke-width="3" fill="none" marker-end="url(#ah)" opacity="0.9"/>
  <path d="M644 760 L 570 760" stroke="#30363d" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
  <text x="540" y="772" fill="#6e7681" font-size="38" text-anchor="middle" font-family="monospace">✕</text>

  <line x1="60" y1="890" x2="1020" y2="890" stroke="#8bd0f0" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.5"/>
  <text x="540" y="952" fill="#cfe3f2" font-size="29" text-anchor="middle">통합 가설을 먼저 세우면 <tspan fill="#8bd0f0" font-weight="700">그 가설에 맞는 증거만</tspan> 보게 된다</text>

  <text x="1020" y="1032" fill="#8bd0f0" font-size="38" text-anchor="end" font-family="monospace" opacity="0.9">euid=0?</text>
</svg>
