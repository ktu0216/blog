<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <clipPath id="c1"><circle cx="330" cy="480" r="170"/></clipPath>
    <clipPath id="c2"><circle cx="530" cy="480" r="170"/></clipPath>
  </defs>
  <rect width="1080" height="1080" fill="#f0efec"/>
  <rect x="0" y="0" width="8" height="1080" fill="#a8412a"/>

  <text x="72" y="92" fill="#5e5d5f" font-size="24" font-family="monospace" letter-spacing="6">AFFECTED IF</text>

  <text x="72" y="182" fill="#1f1f22" font-size="50" font-weight="800">세 조건이 모두 겹칠 때만</text>
  <text x="72" y="230" fill="#5e5d5f" font-size="26">HotSpot JIT의 AVX-512 Base64 디코딩 고속 경로 힙 오버플로</text>

  <!-- intersection -->
  <g clip-path="url(#c1)"><g clip-path="url(#c2)">
    <circle cx="430" cy="650" r="170" fill="#ebe3de"/>
  </g></g>
  <circle cx="330" cy="480" r="170" fill="none" stroke="#737273" stroke-width="2.5"/>
  <circle cx="530" cy="480" r="170" fill="none" stroke="#737273" stroke-width="2.5"/>
  <circle cx="430" cy="650" r="170" fill="none" stroke="#737273" stroke-width="2.5"/>

  <text x="262" y="430" fill="#1f1f22" font-size="26" font-weight="800" text-anchor="middle">JDK 17.0.6+</text>
  <text x="262" y="464" fill="#5e5d5f" font-size="21" text-anchor="middle">21 · 25 · 27</text>
  <text x="600" y="430" fill="#1f1f22" font-size="26" font-weight="800" text-anchor="middle">x86-64</text>
  <text x="600" y="464" fill="#5e5d5f" font-size="21" text-anchor="middle">AVX-512 VBMI</text>
  <text x="430" y="740" fill="#1f1f22" font-size="26" font-weight="800" text-anchor="middle">C2 JIT 컴파일</text>
  <text x="430" y="772" fill="#5e5d5f" font-size="18" font-family="monospace" text-anchor="middle">Base64.getDecoder()</text>

  <rect x="388" y="522" width="84" height="38" rx="19" fill="#a8412a"/>
  <text x="430" y="548" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">영향</text>

  <!-- not affected -->
  <text x="760" y="372" fill="#737273" font-size="19" font-family="monospace" letter-spacing="3">해당 없음</text>
  <text x="760" y="426" fill="#5e5d5f" font-size="24">JDK 8 · 11</text>
  <text x="760" y="476" fill="#5e5d5f" font-size="24">17.0.0–17.0.5</text>
  <text x="760" y="526" fill="#5e5d5f" font-size="24">ARM64</text>
  <text x="760" y="576" fill="#5e5d5f" font-size="24">VBMI 없는 x86</text>

  <line x1="72" y1="870" x2="1008" y2="870" stroke="#dabbb2" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="72" y="930" fill="#1f1f22" font-size="34" font-weight="700">공식 CVSS <tspan fill="#a8412a" font-weight="800">8.1</tspan> (High) — 9.2는 발견자 점수</text>
  <text x="72" y="976" fill="#5e5d5f" font-size="23">인증 없이 원격 가능, 단 공격 복잡도 High · 실제 악용 보고 없음</text>

  <text x="1008" y="1042" fill="#a8412a" font-size="34" text-anchor="end" font-family="monospace" opacity="0.7">[ &gt;_ ]</text>
