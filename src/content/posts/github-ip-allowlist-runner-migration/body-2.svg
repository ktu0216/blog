<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <pattern id="h2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#b5b4b3" stroke-width="3"/>
    </pattern>
    <marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#737273"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#f0efec"/>

  <text x="60" y="62" fill="#1f1f22" font-size="38" font-weight="800">청구 API가 본 것은 전환 이후뿐이었다</text>
  <text x="60" y="100" fill="#5e5d5f" font-size="21">같은 조직, 같은 러너 — 관측 창만 달랐다</text>

  <!-- hidden segment -->
  <rect x="60" y="170" width="800" height="150" rx="10" fill="url(#h2)" opacity="0.55"/>
  <rect x="60" y="170" width="800" height="150" rx="10" fill="none" stroke="#b5b4b3" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="210" y="206" width="500" height="78" rx="8" fill="#f0efec"/>
  <text x="460" y="238" fill="#5e5d5f" font-size="22" font-weight="700" text-anchor="middle">전환 전: 포함 분 3,000분 초과 이력</text>
  <text x="460" y="270" fill="#737273" font-size="19" text-anchor="middle">화면 · API에 안 보임</text>

  <!-- visible segment -->
  <rect x="870" y="170" width="270" height="150" rx="10" fill="#ebe3de" stroke="#a8412a" stroke-width="2.5"/>
  <text x="1005" y="222" fill="#a8412a" font-size="19" font-weight="700" text-anchor="middle">API가 보여준 구간</text>
  <text x="1005" y="282" fill="#a8412a" font-size="40" font-weight="800" text-anchor="middle">월 194분</text>

  <!-- axis -->
  <path d="M60 370 L 1150 370" stroke="#737273" stroke-width="2.5" marker-end="url(#g2)"/>
  <text x="1140" y="404" fill="#5e5d5f" font-size="19" text-anchor="end">시간</text>

  <!-- switch line -->
  <line x1="865" y1="140" x2="865" y2="390" stroke="#1f1f22" stroke-width="3"/>
  <text x="865" y="424" fill="#1f1f22" font-size="21" font-weight="700" text-anchor="middle">플랜 전환 시점</text>

  <line x1="60" y1="464" x2="1140" y2="464" stroke="#dabbb2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="60" y="510" fill="#1f1f22" font-size="24">값이 작았던 게 아니라 <tspan fill="#a8412a" font-weight="800">관측 구간이 짧았다</tspan></text>
</svg>
