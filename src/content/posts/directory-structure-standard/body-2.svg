<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="600" fill="#0d1117"/>
  <text x="60" y="62" fill="#e6edf3" font-size="38" font-weight="800">번호 구역 — 외울 경계는 <tspan font-family="monospace" fill="#4aa3df">10</tspan> 하나뿐</text>
  <text x="60" y="98" fill="#8b949e" font-size="21">형식은 <tspan font-family="monospace" fill="#e6edf3">NN_이름</tspan> 하나. 고정 구역만 용도가 정해져 있고, 나머지는 전부 자유다</text>

  <!-- band 1 : fixed -->
  <rect x="60" y="140" width="340" height="112" rx="14" fill="#0f2233" stroke="#4aa3df" stroke-width="2.5"/>
  <text x="230" y="192" fill="#4aa3df" font-size="36" font-weight="800" text-anchor="middle" font-family="monospace">00 ~ 09</text>
  <text x="230" y="228" fill="#e6edf3" font-size="23" font-weight="700" text-anchor="middle">고정 구역 · 정해진 용도만</text>

  <!-- band 2 : free -->
  <rect x="420" y="140" width="520" height="112" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="680" y="192" fill="#e6edf3" font-size="36" font-weight="800" text-anchor="middle" font-family="monospace">10 ~ 98</text>
  <text x="680" y="228" fill="#8b949e" font-size="23" font-weight="700" text-anchor="middle">자유 구역 · 아무 주제나</text>

  <!-- band 3 : archive -->
  <rect x="960" y="140" width="180" height="112" rx="14" fill="#12151b" stroke="#30363d" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="1050" y="192" fill="#8b949e" font-size="36" font-weight="800" text-anchor="middle" font-family="monospace">99</text>
  <text x="1050" y="228" fill="#8b949e" font-size="23" font-weight="700" text-anchor="middle">보관</text>

  <!-- connectors -->
  <path d="M230 252 L230 288" stroke="#30363d" stroke-width="2"/>
  <path d="M680 252 L680 288" stroke="#30363d" stroke-width="2"/>
  <path d="M1050 252 L1050 288" stroke="#30363d" stroke-width="2"/>

  <!-- panel 1 -->
  <rect x="60" y="290" width="340" height="180" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="334" fill="#4aa3df" font-size="21" font-family="monospace">00_체계</text>
  <text x="212" y="334" fill="#8b949e" font-size="20">규칙 · 프롬프트</text>
  <text x="86" y="372" fill="#4aa3df" font-size="21" font-family="monospace">01_서식</text>
  <text x="212" y="372" fill="#8b949e" font-size="20">템플릿 파일</text>
  <text x="86" y="410" fill="#4aa3df" font-size="21" font-family="monospace">09_대장</text>
  <text x="212" y="410" fill="#8b949e" font-size="20">목록 · 기록</text>
  <text x="86" y="448" fill="#4aa3df" font-size="21" font-family="monospace">02~08</text>
  <text x="212" y="448" fill="#8b949e" font-size="20">저장소별 여유</text>

  <!-- panel 2 -->
  <rect x="420" y="290" width="520" height="180" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="446" y="334" fill="#e6edf3" font-size="20">간격은 자유 — <tspan font-family="monospace" fill="#4aa3df">10·11·12</tspan> 도 <tspan font-family="monospace" fill="#4aa3df">10·20·30</tspan> 도 된다</text>
  <text x="446" y="372" fill="#e6edf3" font-size="20">결번도 문제가 아니다</text>
  <text x="446" y="410" fill="#e6edf3" font-size="20">한 레벨 안에서 번호만 겹치지 않으면 된다</text>
  <text x="446" y="448" fill="#e6edf3" font-size="20">순서는 접근 빈도 — 자주 여는 걸 낮은 번호에</text>

  <!-- panel 3 -->
  <rect x="960" y="290" width="180" height="180" rx="14" fill="#12151b" stroke="#30363d"/>
  <text x="1050" y="352" fill="#8b949e" font-size="20" text-anchor="middle" font-family="monospace">99_보관</text>
  <text x="1050" y="392" fill="#8b949e" font-size="20" text-anchor="middle">폴더 내부</text>
  <text x="1050" y="422" fill="#8b949e" font-size="20" text-anchor="middle">아카이브</text>

  <line x1="60" y1="510" x2="1140" y2="510" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="60" y="556" fill="#e6edf3" font-size="22"><tspan fill="#4aa3df" font-weight="700">지킬 건 셋뿐</tspan> — ① 고정 구역엔 정해진 용도만 ② 한 레벨 안에서 번호 중복 없이 ③ <tspan font-family="monospace">99</tspan>는 보관</text>
</svg>
