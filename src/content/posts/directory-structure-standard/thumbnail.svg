<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#006cac"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="152" fill="#8bd0f0" font-size="28" text-anchor="middle" font-family="monospace" letter-spacing="2">디렉토리 구조 표준 · R1 → R10</text>

  <!-- main title -->
  <text x="540" y="270" fill="#ffffff" font-size="68" font-weight="800" text-anchor="middle">폴더 구조 정리 규칙 10개</text>
  <text x="540" y="342" fill="#cfe3f2" font-size="38" text-anchor="middle">직접 만들어 쓰는 디렉토리 표준</text>

  <line x1="440" y1="392" x2="640" y2="392" stroke="#8bd0f0" stroke-width="3" opacity="0.7"/>

  <!-- row 1 -->
  <rect x="70" y="450" width="288" height="160" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.95"/>
  <text x="94" y="502" fill="#ffffff" font-size="32" font-weight="800">형태</text>
  <text x="94" y="546" fill="#8bd0f0" font-size="26" font-family="monospace" font-weight="700">R1 · R2</text>
  <text x="94" y="586" fill="#8b949e" font-size="21">폭 20 · 깊이 5</text>

  <rect x="396" y="450" width="288" height="160" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.95"/>
  <text x="420" y="502" fill="#ffffff" font-size="32" font-weight="800">이름</text>
  <text x="420" y="546" fill="#8bd0f0" font-size="26" font-family="monospace" font-weight="700">R3</text>
  <text x="420" y="586" fill="#8b949e" font-size="21">금지문자 · ISO 8601</text>

  <rect x="722" y="450" width="288" height="160" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2.5" opacity="0.95"/>
  <text x="746" y="502" fill="#ffffff" font-size="32" font-weight="800">운영</text>
  <text x="746" y="546" fill="#8bd0f0" font-size="26" font-family="monospace" font-weight="700">R4 · R5 · R6</text>
  <text x="746" y="586" fill="#8b949e" font-size="21">가까이 · 경계 · 링크</text>

  <!-- row 2 -->
  <rect x="70" y="640" width="288" height="160" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2" opacity="0.92"/>
  <text x="94" y="692" fill="#ffffff" font-size="32" font-weight="800">예외</text>
  <text x="94" y="736" fill="#8bd0f0" font-size="26" font-family="monospace" font-weight="700">R7 · R8</text>
  <text x="94" y="776" fill="#8b949e" font-size="21">정렬축 · 시스템 경로</text>

  <rect x="396" y="640" width="288" height="160" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2" opacity="0.92"/>
  <text x="420" y="692" fill="#ffffff" font-size="32" font-weight="800">보호</text>
  <text x="420" y="736" fill="#8bd0f0" font-size="26" font-family="monospace" font-weight="700">R9</text>
  <text x="420" y="776" fill="#8b949e" font-size="21">동기화 · 백업 분리</text>

  <rect x="722" y="640" width="288" height="160" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2" opacity="0.92"/>
  <text x="746" y="692" fill="#ffffff" font-size="32" font-weight="800">태도</text>
  <text x="746" y="736" fill="#8bd0f0" font-size="26" font-family="monospace" font-weight="700">R10</text>
  <text x="746" y="776" fill="#8b949e" font-size="21">규모가 규칙보다 먼저</text>

  <line x1="70" y1="868" x2="1010" y2="868" stroke="#8bd0f0" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.5"/>
  <text x="540" y="932" fill="#cfe3f2" font-size="30" text-anchor="middle">처음 시작이라면 <tspan fill="#8bd0f0" font-weight="700">R1 · R3 · R4 · R5</tspan> 네 개만</text>

  <text x="1012" y="1030" fill="#8bd0f0" font-size="40" text-anchor="end" font-family="monospace" opacity="0.9">NN_</text>
</svg>
