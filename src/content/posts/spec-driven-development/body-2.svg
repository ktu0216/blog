<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="720" fill="#0d1117"/>
  <text x="60" y="62" fill="#e6edf3" font-size="38" font-weight="800">기계가 판정할 수 있는 것 / <tspan fill="#4aa3df">없는 것</tspan> — 경계 긋기</text>
  <text x="60" y="98" fill="#8b949e" font-size="21">이 경계선이 곧 사람 승인 게이트가 서야 할 자리다</text>

  <!-- boundary -->
  <line x1="620" y1="140" x2="620" y2="620" stroke="#4aa3df" stroke-width="2.5" stroke-dasharray="9 9" opacity="0.75"/>

  <!-- left panel : machine-checkable -->
  <rect x="60" y="150" width="520" height="470" rx="14" fill="#0f2233" stroke="#4aa3df" stroke-width="2.5"/>
  <text x="86" y="198" fill="#4aa3df" font-size="26" font-weight="800">기계가 판정 가능</text>
  <text x="554" y="198" fill="#4aa3df" font-size="24" font-weight="800" text-anchor="end" font-family="monospace">8</text>
  <text x="86" y="230" fill="#8b949e" font-size="19">스크립트로 옮기면 매번 자동으로 걸린다</text>
  <line x1="86" y1="250" x2="554" y2="250" stroke="#30363d" stroke-width="1.5"/>

  <path d="M88 288 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="296" fill="#e6edf3" font-size="21">프론트매터 스키마 · 필수 항목 누락</text>
  <path d="M88 332 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="340" fill="#e6edf3" font-size="21">발행일이 현재보다 과거인가</text>
  <path d="M88 376 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="384" fill="#e6edf3" font-size="21">PII 패턴 · 이메일 / API 키 / 사설 IP</text>
  <path d="M88 420 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="428" fill="#e6edf3" font-size="21">금지 표현 포함 여부</text>
  <path d="M88 464 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="472" fill="#e6edf3" font-size="21">외부 링크가 200을 반환하는가</text>
  <path d="M88 508 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="516" fill="#e6edf3" font-size="21">이미지 <tspan font-family="monospace">alt</tspan> 텍스트 존재 여부</text>
  <path d="M88 552 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="560" fill="#e6edf3" font-size="21">해시태그가 5~15개 범위인가</text>
  <path d="M88 596 l9 10 l18 -21" stroke="#4aa3df" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="604" fill="#e6edf3" font-size="21">글 파일이 규칙대로 평면 파일인가</text>

  <!-- right panel : human-only -->
  <rect x="660" y="150" width="480" height="470" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="686" y="198" fill="#e6edf3" font-size="26" font-weight="800">사람만 판정 가능</text>
  <text x="1114" y="198" fill="#8b949e" font-size="24" font-weight="800" text-anchor="end" font-family="monospace">4</text>
  <text x="686" y="230" fill="#8b949e" font-size="19">자동 검사가 대신해줄 수 없다</text>
  <line x1="686" y1="250" x2="1114" y2="250" stroke="#30363d" stroke-width="1.5"/>

  <circle cx="697" cy="290" r="6" fill="none" stroke="#8b949e" stroke-width="2.5"/>
  <text x="730" y="298" fill="#e6edf3" font-size="22">재미있는가</text>
  <circle cx="697" cy="350" r="6" fill="none" stroke="#8b949e" stroke-width="2.5"/>
  <text x="730" y="358" fill="#e6edf3" font-size="22">논지가 실제로 성립하는가</text>
  <circle cx="697" cy="410" r="6" fill="none" stroke="#8b949e" stroke-width="2.5"/>
  <text x="730" y="418" fill="#e6edf3" font-size="22">톤이 글 전체에서 일관된가</text>
  <circle cx="697" cy="470" r="6" fill="none" stroke="#8b949e" stroke-width="2.5"/>
  <text x="730" y="478" fill="#e6edf3" font-size="22">다른 글에 없는 정보가 담겼는가</text>

  <rect x="686" y="518" width="428" height="76" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="710" y="552" fill="#8b949e" font-size="19">왼쪽까지 사람이 떠맡고 있으면</text>
  <text x="710" y="580" fill="#8b949e" font-size="19">정작 오른쪽을 볼 여력이 남지 않는다</text>

  <line x1="60" y1="655" x2="1140" y2="655" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="60" y="696" fill="#e6edf3" font-size="22"><tspan fill="#4aa3df" font-weight="700">문서에만 있는 규칙</tspan>은 지켜지지 않았을 때 아무 소리도 내지 않는다.</text>
</svg>
