<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1080" height="1080" fill="#f0efec"/>
  <rect x="0" y="0" width="8" height="1080" fill="#a8412a"/>

  <text x="72" y="92" fill="#5e5d5f" font-size="24" font-family="monospace" letter-spacing="6">로컬 LLM 홈서버 · 손익분기</text>

  <text x="72" y="182" fill="#1f1f22" font-size="54" font-weight="800">하드웨어 값을 토큰으로 바꾸면</text>
  <text x="72" y="230" fill="#5e5d5f" font-size="26">Mac Studio M5 Max $2,499 ≈ Sonnet 5 혼합 단가로 약 4.2억 토큰</text>

  <!-- balance -->
  <line x1="210" y1="365" x2="870" y2="435" stroke="#a8412a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="540" cy="400" r="13" fill="#f0efec" stroke="#a8412a" stroke-width="5"/>
  <path d="M540 414 L 598 496 L 482 496 Z" fill="#f9f9f8" stroke="#a8412a" stroke-width="2.5"/>
  <rect x="430" y="496" width="220" height="10" rx="5" fill="#dabbb2"/>
  <text x="540" y="552" fill="#a8412a" font-size="30" font-weight="800" text-anchor="middle">가동률</text>
  <text x="540" y="586" fill="#5e5d5f" font-size="20" text-anchor="middle">이 축이 저울을 기울인다</text>

  <line x1="210" y1="365" x2="210" y2="408" stroke="#dabbb2" stroke-width="3"/>
  <line x1="870" y1="435" x2="870" y2="478" stroke="#dabbb2" stroke-width="3"/>

  <!-- left pan: hardware -->
  <rect x="36" y="408" width="348" height="196" rx="14" fill="#f9f9f8" stroke="#dabbb2" stroke-width="2"/>
  <text x="60" y="444" fill="#5e5d5f" font-size="19" font-family="monospace" letter-spacing="3">하드웨어 · 1회 지출</text>
  <text x="60" y="486" fill="#1f1f22" font-size="21">맥미니 M6</text>
  <text x="360" y="486" fill="#1f1f22" font-size="22" font-weight="700" text-anchor="end" font-family="monospace">$899</text>
  <text x="60" y="526" fill="#1f1f22" font-size="21">맥스튜디오 M5 Max</text>
  <text x="360" y="526" fill="#1f1f22" font-size="22" font-weight="700" text-anchor="end" font-family="monospace">$2,499</text>
  <text x="60" y="566" fill="#1f1f22" font-size="21">맥스튜디오 M5 Ultra</text>
  <text x="360" y="566" fill="#1f1f22" font-size="22" font-weight="700" text-anchor="end" font-family="monospace">$5,499</text>

  <!-- right pan: API tokens -->
  <rect x="696" y="478" width="348" height="196" rx="14" fill="#f9f9f8" stroke="#dabbb2" stroke-width="2"/>
  <text x="720" y="514" fill="#5e5d5f" font-size="19" font-family="monospace" letter-spacing="3">API 토큰 · 쓴 만큼</text>
  <text x="720" y="556" fill="#1f1f22" font-size="21">Sonnet 5 입력</text>
  <text x="1020" y="556" fill="#1f1f22" font-size="22" font-weight="700" text-anchor="end" font-family="monospace">$3 / 1M</text>
  <text x="720" y="596" fill="#1f1f22" font-size="21">Sonnet 5 출력</text>
  <text x="1020" y="596" fill="#1f1f22" font-size="22" font-weight="700" text-anchor="end" font-family="monospace">$15 / 1M</text>
  <text x="720" y="636" fill="#a8412a" font-size="21" font-weight="700">혼합 3:1</text>
  <text x="1020" y="636" fill="#a8412a" font-size="22" font-weight="800" text-anchor="end" font-family="monospace">$6 / 1M</text>

  <text x="72" y="742" fill="#5e5d5f" font-size="22">$2,499 회수까지 — 24시간 3.2개월 · 하루 8시간 9.6개월 · 하루 30분 회수 불가</text>
  <text x="72" y="790" fill="#5e5d5f" font-size="22">메모리 +$400(16→32GB)은 Sonnet 5 토큰 6,700만 개 값 — 그 32B는 5~6 tok/s</text>

  <line x1="72" y1="880" x2="1008" y2="880" stroke="#dabbb2" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="72" y="938" fill="#1f1f22" font-size="34" font-weight="700">저울을 기울이는 건 가격이 아니라 <tspan fill="#a8412a" font-weight="800">가동률</tspan>이다</text>
  <text x="72" y="986" fill="#5e5d5f" font-size="23">속도·절감액은 전부 계산에 의한 추정 — M5·M6 실측 벤치마크는 아직 없다</text>

  <text x="1008" y="1042" fill="#a8412a" font-size="34" text-anchor="end" font-family="monospace" opacity="0.7">[ &gt;_ ]</text>
</svg>
