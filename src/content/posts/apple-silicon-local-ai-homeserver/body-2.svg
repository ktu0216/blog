  <text x="590" y="564" fill="#1f1f22" font-size="21" font-weight="400">64GB M5 Pro 맥미니 · 약 4~5 tok/s</text>
  <text x="590" y="596" fill="#5e5d5f" font-size="21">M5 Max 맥스튜디오 · 약 9~11 tok/s</text>
  <line x1="60" y1="620" x2="1120" y2="620" stroke="#dabbb2" stroke-width="1" stroke-dasharray="5 6" opacity="0.7"/>

