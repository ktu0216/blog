  <text x="590" y="716" fill="#5e5d5f" font-size="21">M5 Max 맥스튜디오 · 약 20 tok/s</text>
  <line x1="60" y1="740" x2="1120" y2="740" stroke="#dabbb2" stroke-width="1" stroke-dasharray="5 6" opacity="0.7"/>

  <!-- 8B -->
  <text x="60" y="804" fill="#1f1f22" font-size="36" font-weight="800">8B</text>
  <text x="60" y="836" fill="#5e5d5f" font-size="20">Q4 약 4.6GB</text>
  <rect x="270" y="790" width="31" height="34" rx="6" fill="#a8412a" opacity="0.85"/>
  <text x="590" y="804" fill="#1f1f22" font-size="21" font-weight="400">16GB M6 맥미니 $899 · 약 20~22 tok/s</text>
  <text x="590" y="836" fill="#5e5d5f" font-size="21">이론 상한 37 tok/s에 효율 0.6 적용</text>

  <path d="M1146 870 L 1146 165" stroke="#737273" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#b2u)"/>
  <text x="1174" y="520" fill="#5e5d5f" font-size="19" text-anchor="middle" transform="rotate(-90 1174 520)">위로 갈수록 느려진다</text>

  <line x1="60" y1="900" x2="1140" y2="900" stroke="#dabbb2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="60" y="944" fill="#1f1f22" font-size="22">속도 = <tspan font-family="monospace" fill="#a8412a">(대역폭 ÷ 모델 점유 메모리) × 0.6</tspan> 으로 계산한 추정치 — M5·M6 실측은 아직 없다</text>
