  <text x="590" y="444" fill="#1f1f22" font-size="21" font-weight="400">128GB M5 Max 맥스튜디오</text>
  <text x="590" y="476" fill="#5e5d5f" font-size="21">속도 추정치 없음</text>
  <line x1="60" y1="500" x2="1120" y2="500" stroke="#dabbb2" stroke-width="1" stroke-dasharray="5 6" opacity="0.7"/>

