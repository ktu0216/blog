  <line x1="60" y1="260" x2="1120" y2="260" stroke="#dabbb2" stroke-width="1" stroke-dasharray="5 6" opacity="0.7"/>

  <!-- 235B -->
  <text x="60" y="324" fill="#1f1f22" font-size="36" font-weight="800">235B</text>
  <text x="60" y="356" fill="#5e5d5f" font-size="20">Q4 약 134GB</text>
  <rect x="270" y="310" width="167" height="34" rx="6" fill="#a8412a" opacity="0.85"/>
