<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="b2u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#737273"/>
    </marker>
  </defs>
  <rect width="1200" height="980" fill="#f0efec"/>

  <text x="60" y="62" fill="#1f1f22" font-size="38" font-weight="800">용량은 올릴 수 있는 크기를, 대역폭은 속도를 정한다</text>
  <text x="60" y="100" fill="#5e5d5f" font-size="21">Q4_K_M 기준 파라미터당 약 0.6바이트 · KV 캐시와 런타임 오버헤드 15~20%는 별도</text>

  <text x="60" y="136" fill="#5e5d5f" font-size="18" font-weight="700" letter-spacing="3">모델 크기</text>
  <text x="270" y="136" fill="#5e5d5f" font-size="18" font-weight="700" letter-spacing="3">필요 메모리</text>
  <text x="590" y="136" fill="#5e5d5f" font-size="18" font-weight="700" letter-spacing="3">도달 제품 · 생성 속도(추정)</text>

  <!-- 671B -->
  <text x="60" y="204" fill="#1f1f22" font-size="36" font-weight="800">671B</text>
  <text x="60" y="236" fill="#5e5d5f" font-size="20">Q4 약 405GB (실측)</text>
  <rect x="270" y="190" width="290" height="34" rx="6" fill="#a8412a" opacity="0.85"/>
