<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#006cac"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="132" fill="#8bd0f0" font-size="27" text-anchor="middle" font-family="monospace" letter-spacing="2">Cloudflare Web Analytics · 정적 블로그</text>

  <text x="540" y="270" fill="#ffffff" font-size="86" font-weight="800" text-anchor="middle">정적 블로그</text>
  <text x="540" y="374" fill="#ffffff" font-size="86" font-weight="800" text-anchor="middle">방문자 읽기</text>

  <text x="540" y="448" fill="#cfe3f2" font-size="32" text-anchor="middle">비컨 한 줄로 채운 텅 빈 대시보드</text>

  <!-- before panel: empty dashboard -->
  <rect x="80" y="540" width="430" height="360" rx="20" fill="#081019" fill-opacity="0.55" stroke="#9fb6c9" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="295" y="600" fill="#9fb6c9" font-size="28" font-weight="800" text-anchor="middle">설치 전</text>
  <text x="295" y="642" fill="#9fb6c9" font-size="22" text-anchor="middle">Visits</text>
  <text x="295" y="708" fill="#cfe3f2" font-size="58" font-weight="800" text-anchor="middle">0</text>
  <!-- flat baseline -->
  <line x1="130" y1="820" x2="460" y2="820" stroke="#5a6b7a" stroke-width="3"/>
  <text x="295" y="872" fill="#9fb6c9" font-size="23" text-anchor="middle">텅 빈 그래프</text>

  <!-- after panel: filled dashboard -->
  <rect x="570" y="540" width="430" height="360" rx="20" fill="#081019" fill-opacity="0.55" stroke="#8bd0f0" stroke-width="2.5"/>
  <text x="785" y="600" fill="#8bd0f0" font-size="28" font-weight="800" text-anchor="middle">설치 후</text>
  <text x="785" y="642" fill="#cfe3f2" font-size="22" text-anchor="middle">Visits</text>
  <!-- rising bars -->
  <rect x="628" y="792" width="34" height="28" rx="4" fill="#3a6a8c"/>
  <rect x="678" y="770" width="34" height="50" rx="4" fill="#4383a8"/>
  <rect x="728" y="740" width="34" height="80" rx="4" fill="#5a9bc4"/>
  <rect x="778" y="704" width="34" height="116" rx="4" fill="#7bb8dc"/>
  <rect x="828" y="668" width="34" height="152" rx="4" fill="#8bd0f0"/>
  <rect x="878" y="700" width="34" height="120" rx="4" fill="#7bb8dc"/>
  <!-- trend line -->
  <polyline points="645,796 695,776 745,748 795,714 845,676 895,708" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="785" y="872" fill="#8bd0f0" font-size="23" text-anchor="middle">채워지는 방문 추세</text>

  <!-- arrow between -->
  <circle cx="540" cy="720" r="40" fill="#0a1020" stroke="#8bd0f0" stroke-width="2.5"/>
  <path d="M521 720 L557 720 M546 709 L559 720 L546 731" stroke="#8bd0f0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="540" y="978" fill="#cfe3f2" font-size="26" text-anchor="middle">GitHub Pages · AstroPaper · 프록시 없이 스니펫 한 줄</text>
</svg>
