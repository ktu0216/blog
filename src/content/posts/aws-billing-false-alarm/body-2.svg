<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="912" viewBox="0 0 1200 912" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="912" fill="#0d1117"/>
  <text x="60" y="64" fill="#e6edf3" font-size="38" font-weight="800">비용 알람 오탐 판별 흐름도</text>
  <text x="60" y="98" fill="#8b949e" font-size="21">하류 신호는 참고, 결정적 증거는 파이프라인 바깥에 있다</text>

  <!-- Step 1 -->
  <rect x="60" y="130" width="830" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="167" fill="#e6edf3" font-size="24" font-weight="700">알람 수신</text>
  <text x="86" y="194" fill="#8b949e" font-size="20">천문학적이든 그럴듯하든 — 일단 멈추고 확인</text>

  <path d="M475 208 L475 226 M468 219 L475 226 L482 219" stroke="#4aa3df" stroke-width="2.5" fill="none"/>

  <!-- Step 2 -->
  <rect x="60" y="228" width="830" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="265" fill="#e6edf3" font-size="24" font-weight="700">자릿수 확인</text>
  <text x="86" y="292" fill="#8b949e" font-size="20">억·조 단위면 사실상 오류 — 다만 힌트일 뿐, 증거 아님</text>

  <path d="M475 306 L475 324 M468 317 L475 324 L482 317" stroke="#4aa3df" stroke-width="2.5" fill="none"/>

  <!-- Step 3 -->
  <rect x="60" y="326" width="830" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="363" fill="#e6edf3" font-size="24" font-weight="700">Health Dashboard</text>
  <text x="86" y="390" fill="#8b949e" font-size="20">30초 확인 — 다만 조용하다고 무죄 아님 (6시간 공백)</text>

  <path d="M475 404 L475 422 M468 415 L475 422 L482 415" stroke="#4aa3df" stroke-width="2.5" fill="none"/>

  <!-- Step 4 -->
  <rect x="60" y="424" width="830" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="461" fill="#e6edf3" font-size="24" font-weight="700">Bills: Pending vs Issued</text>
  <text x="86" y="488" fill="#8b949e" font-size="20">Pending=추정(깨진 계층) · Issued=확정 인보이스</text>

  <path d="M475 502 L475 520 M468 513 L475 520 L482 513" stroke="#4aa3df" stroke-width="2.5" fill="none"/>

  <!-- Step 5 -->
  <rect x="60" y="522" width="830" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="559" fill="#e6edf3" font-size="24" font-weight="700">Cost Explorer 드릴다운</text>
  <text x="86" y="586" fill="#8b949e" font-size="20">금액이 아니라 귀속(attribution)이 내 아키텍처와 맞는지</text>

  <!-- boundary line -->
  <line x1="60" y1="626" x2="890" y2="626" stroke="#4aa3df" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="470" y="611" width="220" height="30" rx="15" fill="#0d1117"/>
  <text x="580" y="632" fill="#4aa3df" font-size="19" font-weight="700" text-anchor="middle">여기서 파이프라인 바깥으로</text>

  <path d="M475 646 L475 664 M468 657 L475 664 L482 657" stroke="#4aa3df" stroke-width="2.5" fill="none"/>

  <!-- Step 6 (accent, key) -->
  <rect x="60" y="666" width="830" height="90" rx="12" fill="#0f2233" stroke="#4aa3df" stroke-width="2.5"/>
  <text x="86" y="708" fill="#4aa3df" font-size="25" font-weight="800">🔑 실제 리소스 인벤토리 대조</text>
  <text x="86" y="738" fill="#e6edf3" font-size="20">EC2·S3 목록엔 그 리소스가 있는가? — 빌링 바깥의 독립 증거 · 결정적</text>

  <path d="M475 760 L475 778 M468 771 L475 778 L482 771" stroke="#4aa3df" stroke-width="2.5" fill="none"/>

  <!-- Step 7 -->
  <rect x="60" y="780" width="830" height="76" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="86" y="817" fill="#e6edf3" font-size="24" font-weight="700">그래도 설명 안 되면 → Support 티켓</text>
  <text x="86" y="844" fill="#8b949e" font-size="20">추정치가 아니라 확정 Issued 인보이스가 틀렸을 때가 대상</text>

  <!-- right band A: inside pipeline -->
  <rect x="915" y="424" width="225" height="174" rx="14" fill="#12151b" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="1027" y="500" fill="#8b949e" font-size="23" font-weight="800" text-anchor="middle">파이프라인 내부</text>
  <text x="1027" y="532" fill="#8b949e" font-size="18" text-anchor="middle">하류 신호 — 오염된</text>
  <text x="1027" y="556" fill="#8b949e" font-size="18" text-anchor="middle">값끼리 사이좋게 일치</text>

  <!-- right band B: outside pipeline -->
  <rect x="915" y="666" width="225" height="90" rx="14" fill="#0f2233" stroke="#4aa3df" stroke-width="2"/>
  <text x="1027" y="706" fill="#4aa3df" font-size="23" font-weight="800" text-anchor="middle">파이프라인 바깥</text>
  <text x="1027" y="736" fill="#8b949e" font-size="18" text-anchor="middle">독립 증거 · 신뢰 좌표</text>

  <text x="60" y="895" fill="#8b949e" font-size="21">되돌릴 수 없는 행동(버킷 삭제·계정 폐쇄)을, 되돌릴 수 있는 확인보다 먼저 하지 않는다.</text>
</svg>
