<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#006cac"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="150" fill="#8bd0f0" font-size="28" text-anchor="middle" font-family="monospace" letter-spacing="2">AWS · 비용 알람 오탐 · 2026-07-17</text>

  <text x="540" y="300" fill="#ffffff" font-size="90" font-weight="800" text-anchor="middle">진짜 과금인지</text>
  <text x="540" y="410" fill="#ffffff" font-size="90" font-weight="800" text-anchor="middle">가르는 법</text>

  <text x="540" y="492" fill="#cfe3f2" font-size="34" text-anchor="middle">표시된 것과 실재하는 것, 두 계층을 나눈다</text>

  <!-- left chip: displayed (broken estimate layer) -->
  <rect x="80" y="590" width="430" height="300" rx="20" fill="#081019" fill-opacity="0.5" stroke="#9fb6c9" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="295" y="660" fill="#cfe3f2" font-size="34" font-weight="800" text-anchor="middle">표시된 것</text>
  <text x="295" y="722" fill="#9fb6c9" font-size="26" text-anchor="middle">Estimated · Pending</text>
  <text x="295" y="782" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle">약 1.5조 달러</text>
  <text x="295" y="842" fill="#9fb6c9" font-size="23" text-anchor="middle">= 추정 계층 (이번에 깨짐)</text>

  <!-- right chip: real (confirmed / existing layer) -->
  <rect x="570" y="590" width="430" height="300" rx="20" fill="#081019" fill-opacity="0.5" stroke="#8bd0f0" stroke-width="2.5"/>
  <text x="785" y="660" fill="#8bd0f0" font-size="34" font-weight="800" text-anchor="middle">실재하는 것</text>
  <text x="785" y="722" fill="#cfe3f2" font-size="26" text-anchor="middle">Issued 인보이스 · 실제 리소스</text>
  <text x="785" y="782" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle">$2 미만</text>
  <text x="785" y="842" fill="#8bd0f0" font-size="23" text-anchor="middle">= 확정·실존 계층</text>

  <!-- vs badge in the middle -->
  <circle cx="540" cy="740" r="38" fill="#0a1020" stroke="#8bd0f0" stroke-width="2.5"/>
  <text x="540" y="752" fill="#8bd0f0" font-size="30" font-weight="800" text-anchor="middle">vs</text>

  <text x="540" y="990" fill="#cfe3f2" font-size="27" text-anchor="middle">비용은 실존하는 리소스의 함수다 — 없는 리소스의 비용은 실재하지 않는다</text>
</svg>
