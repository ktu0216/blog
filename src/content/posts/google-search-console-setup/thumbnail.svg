<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#006cac"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="250" fill="#8bd0f0" font-size="30" text-anchor="middle" font-family="monospace" letter-spacing="2">Google Search Console · 색인</text>

  <!-- site: search showing 0 results -->
  <rect x="270" y="300" width="540" height="72" rx="36" fill="#0d1117" stroke="#4aa3df" stroke-width="2" opacity="0.92"/>
  <text x="306" y="345" fill="#8bd0f0" font-size="28" font-family="monospace">site:blog.saegida.com</text>
  <text x="774" y="345" fill="#8b949e" font-size="28" text-anchor="end" font-family="monospace">0건</text>

  <text x="540" y="500" fill="#ffffff" font-size="80" font-weight="800" text-anchor="middle">발행한 글이</text>
  <text x="540" y="600" fill="#ffffff" font-size="80" font-weight="800" text-anchor="middle">검색에 안 뜰 때</text>

  <text x="540" y="686" fill="#cfe3f2" font-size="34" text-anchor="middle">등록부터 DNS 인증·사이트맵·색인 요청까지</text>

  <!-- 3-step summary chips -->
  <g font-size="26" font-weight="700">
    <rect x="120" y="770" width="256" height="88" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2" opacity="0.92"/>
    <text x="248" y="812" fill="#8bd0f0" font-size="24" text-anchor="middle">① 등록 · DNS 인증</text>
    <text x="248" y="842" fill="#8b949e" font-size="20" text-anchor="middle">도메인 속성</text>

    <rect x="412" y="770" width="256" height="88" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2" opacity="0.92"/>
    <text x="540" y="812" fill="#8bd0f0" font-size="24" text-anchor="middle">② 사이트맵 제출</text>
    <text x="540" y="842" fill="#8b949e" font-size="20" text-anchor="middle">sitemap-index.xml</text>

    <rect x="704" y="770" width="256" height="88" rx="16" fill="#0d1117" stroke="#4aa3df" stroke-width="2" opacity="0.92"/>
    <text x="832" y="812" fill="#8bd0f0" font-size="24" text-anchor="middle">③ 색인 요청</text>
    <text x="832" y="842" fill="#8b949e" font-size="20" text-anchor="middle">URL 검사</text>
  </g>

  <!-- arrows between chips -->
  <path d="M382 814 L406 814 M398 806 L406 814 L398 822" stroke="#8bd0f0" stroke-width="2.5" fill="none"/>
  <path d="M674 814 L698 814 M690 806 L698 814 L690 822" stroke="#8bd0f0" stroke-width="2.5" fill="none"/>

  <text x="1016" y="1030" fill="#8bd0f0" font-size="40" text-anchor="end" font-family="monospace" opacity="0.9">🔍</text>
</svg>
